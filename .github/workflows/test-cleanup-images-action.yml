# Integration tests for Cleanup Old Container Images composite action
# Tests run in dry-run mode against non-existent packages so no real image
# versions are ever deleted. They validate output wiring and input validation.

name: Test Cleanup Images Action

on:
  pull_request:
    paths:
      - "actions/cleanup-images/**"
      - ".github/workflows/test-cleanup-images-action.yml"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    paths:
      - "actions/cleanup-images/**"
      - ".github/workflows/test-cleanup-images-action.yml"
  workflow_dispatch:

permissions: {}

jobs:
  # Test 1: Dry-run against non-existent packages produces outputs and deletes nothing
  cleanup-images-dry-run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - &harden-runner
        name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cleanup - dry run against non-existent packages
        id: cleanup
        uses: ./actions/cleanup-images
        with:
          packages: |
            geti-ci-nonexistent-package-a
            geti-ci-nonexistent-package-b
          min-versions-to-keep: 5
          dry-run: true

      - name: Verify outputs
        shell: bash
        env:
          SCANNED_PACKAGES: ${{ steps.cleanup.outputs.scanned-packages }}
          RETAINED_RELEASE: ${{ steps.cleanup.outputs.retained-release }}
          CANDIDATES: ${{ steps.cleanup.outputs.candidates }}
          DELETED: ${{ steps.cleanup.outputs.deleted }}
        run: |
          if [[ "$SCANNED_PACKAGES" != "2" ]]; then
            echo "Error: expected 2 scanned packages, got '$SCANNED_PACKAGES'"
            exit 1
          fi
          if [[ "$DELETED" != "0" ]]; then
            echo "Error: dry-run must not delete anything, got deleted='$DELETED'"
            exit 1
          fi
          if [[ -z "$RETAINED_RELEASE" || -z "$CANDIDATES" ]]; then
            echo "Error: retained-release/candidates outputs are empty"
            exit 1
          fi
          echo "✅ Dry-run test passed (scanned=$SCANNED_PACKAGES, deleted=$DELETED)"

  # Test 2: Invalid min-versions-to-keep must fail the action
  cleanup-images-validation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - *harden-runner

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cleanup with invalid min-versions-to-keep
        id: cleanup-invalid
        continue-on-error: true
        uses: ./actions/cleanup-images
        with:
          packages: geti-ci-nonexistent-package
          min-versions-to-keep: not-a-number
          dry-run: true

      - name: Verify action failed on invalid input
        shell: bash
        env:
          OUTCOME: ${{ steps.cleanup-invalid.outcome }}
        run: |
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "Error: expected action to fail on invalid min-versions-to-keep, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "✅ Validation test passed (action failed as expected)"

  # Test 3: Dry-run against real geti-cpu package; verify child manifests of the
  # develop tag are NOT deletion candidates (guards introduced in PR #108).
  cleanup-images-child-manifest-guard-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - *harden-runner

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cleanup dry-run against geti-cpu with extra-retained-tags
        id: cleanup
        uses: ./actions/cleanup-images
        with:
          packages: geti-cpu
          min-versions-to-keep: 0
          dry-run: true
          extra-retained-tags: develop
          owner: open-edge-platform

      - name: Verify develop child manifests match independent resolution and are not candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: open-edge-platform
          PACKAGE: geti-cpu
          DEVELOP_TAG: develop
          ACTION_EXTRA_CHILD_MANIFESTS: ${{ steps.cleanup.outputs.extra-retained-child-manifests }}
          CANDIDATE_NAMES: ${{ steps.cleanup.outputs.candidate-names }}
        run: |
          set -euo pipefail

          package_url="$(printf '%s' "${PACKAGE}" | jq -sRr @uri)"

          # Resolve develop tag digest via the packages API.
          raw_versions="$(gh api --paginate \
            "orgs/${OWNER}/packages/container/${package_url}/versions?per_page=100")"
          develop_digest="$(printf '%s\n' "${raw_versions}" | jq -r \
            --arg tag "${DEVELOP_TAG}" \
            'map(if type=="array" then .[] else . end) | .[] |
             select(any(.metadata.container.tags[]?; . == $tag)) | .name' | head -1)"

          if [[ -z "${develop_digest}" ]]; then
            echo "::error::develop tag not found in ${OWNER}/${PACKAGE}; cannot run deterministic guard test."
            exit 1
          fi
          echo "develop digest: ${develop_digest}"

          # Obtain a GHCR registry token.
          scope="$(printf 'repository:%s/%s:pull' "${OWNER}" "${PACKAGE}" | jq -sRr @uri)"
          reg_token="$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=${scope}" \
            | jq -r '.token // .access_token // empty')"
          if [[ -z "${reg_token}" ]]; then
            echo "::error::Could not obtain GHCR registry token for ${OWNER}/${PACKAGE}."
            exit 1
          fi

          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          # Independently resolve child manifests of the develop index.
          manifest="$(curl -fsSL \
            -H "Authorization: Bearer ${reg_token}" \
            -H "Accept: ${accept}" \
            "https://ghcr.io/v2/${OWNER}/${package_url}/manifests/${develop_digest}")"
          mapfile -t independent_children < <(
            printf '%s' "${manifest}" | jq -r '.manifests[]?.digest // empty' 2>/dev/null | sort -u
          )

          if [[ "${#independent_children[@]}" -eq 0 ]]; then
            echo "::error::No child manifests found for develop tag (single-arch image?); test is inconclusive."
            exit 1
          fi
          echo "Independently resolved child manifests of develop (${#independent_children[@]}):"
          printf '  %s\n' "${independent_children[@]}"

          # Parse the action's extra-retained-child-manifests output and sort.
          mapfile -t action_children < <(
            printf '%s\n' "${ACTION_EXTRA_CHILD_MANIFESTS}" | grep -v '^$' | sort -u
          )

          if [[ "${#action_children[@]}" -eq 0 ]]; then
            echo "::error::Action reported no child manifests for the develop tag (extra-retained-child-manifests is empty)."
            exit 1
          fi
          echo "Action-reported child manifests of develop (${#action_children[@]}):"
          printf '  %s\n' "${action_children[@]}"

          # The two lists must be identical.
          action_sorted="$(printf '%s\n' "${action_children[@]}" | sort -u)"
          independent_sorted="$(printf '%s\n' "${independent_children[@]}" | sort -u)"
          if [[ "${action_sorted}" != "${independent_sorted}" ]]; then
            echo "::error::Action and independently resolved child manifest lists differ:"
            diff <(echo "${action_sorted}") <(echo "${independent_sorted}") || true
            exit 1
          fi
          echo "✅ Lists match: action and independent resolution agree on ${#action_children[@]} child manifest(s)"

          # None of the develop child manifests must appear in the deletion candidates.
          mapfile -t candidate_digests < <(printf '%s\n' "${CANDIDATE_NAMES}" | grep -v '^$')
          failed=0
          for child in "${independent_children[@]}"; do
            for candidate in "${candidate_digests[@]}"; do
              if [[ "${child}" == "${candidate}" ]]; then
                echo "ERROR: develop child manifest ${child} is a deletion candidate!"
                failed=$((failed + 1))
              fi
            done
          done
          if [[ "${failed}" -gt 0 ]]; then
            echo "❌ Guard check failed: ${failed} develop child manifest(s) are deletion candidates"
            exit 1
          fi
          echo "✅ Guard verified: none of the ${#independent_children[@]} develop child manifests are deletion candidates"

  # Summary job - provides single point of success/failure
  cleanup-images-test-summary:
    runs-on: ubuntu-latest
    needs:
      - cleanup-images-dry-run-test
      - cleanup-images-validation-test
      - cleanup-images-child-manifest-guard-test
    if: always()
    steps:
      - name: Check test results
        shell: bash
        env:
          TEST_DRY_RUN_RESULT: ${{ needs.cleanup-images-dry-run-test.result }}
          TEST_VALIDATION_RESULT: ${{ needs.cleanup-images-validation-test.result }}
          TEST_GUARD_RESULT: ${{ needs.cleanup-images-child-manifest-guard-test.result }}
        run: |
          if [[ "$TEST_DRY_RUN_RESULT" != "success" ]]; then
            echo "❌ Dry-run test failed"
            exit 1
          fi
          if [[ "$TEST_VALIDATION_RESULT" != "success" ]]; then
            echo "❌ Validation test failed"
            exit 1
          fi
          if [[ "$TEST_GUARD_RESULT" != "success" ]]; then
            echo "❌ Child manifest guard test failed"
            exit 1
          fi
          echo "✅ All Cleanup Images action tests passed successfully!"
